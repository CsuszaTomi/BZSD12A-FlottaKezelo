<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>Dashboard</title>
    <style>
        .header-bar {
            background-color: #dbeafe;
        }
        .history-box {
            background-color: #e5e7eb;
            min-height: 150px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="header-bar d-flex justify-content-between align-items-center p-3 border-bottom">
        <button class="btn btn-link text-dark p-0">
            <i class="bi bi-list fs-3"></i>
        </button>
        <button class="btn btn-link text-dark p-0">
            <i class="bi bi-person-circle fs-3"></i>
        </button>
    </div>
    <div class="container py-4">
        <h2 class="text-center mb-5">Üdv, Béla!</h2>
        <div class="row align-items-center mb-5">
            <div class="col-md-6 mb-4 mb-md-0">
                <div class="mb-4">
                    <label for="tankolasInput" class="form-label fw-bold mb-1">Tankolás:</label>
                    <input type="text" class="form-control" id="tankolasInput" placeholder="Input field">
                </div>
                <div class="mb-4">
                    <label for="oraallasInput" class="form-label fw-bold mb-1">Jelenlegi óraállás</label>
                    <input type="text" class="form-control" id="oraallasInput" placeholder="Input field">
                </div>
                <div class="mb-4">
                    <label for="karInput" class="form-label fw-bold mb-1">Kár bejelentése</label>
                    <input type="text" class="form-control" id="karInput" placeholder="Input field">
                </div>
            </div>
            <div class="col-md-6 text-center">
                <img src="https://via.placeholder.com/400x200?text=Aut%C3%B3+k%C3%A9p" class="img-fluid rounded" alt="Autó">
            </div>
        </div>
        <div class="history-box p-3 rounded">
            <h5 class="text-secondary">History</h5>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
