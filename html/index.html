<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Bejelentkezés</title>
    <style>
        .header-bar {
            background-color: #dbeafe;
            height: 40px;
        }
        .form-card {
            max-width: 400px;
            width: 100%;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="form-card bg-white p-4 rounded shadow-sm">
            <h2 class="text-center mb-4">Bejelentkezés</h2>
            <form>
                <div class="mb-3">
                    <label for="nameInput" class="form-label text-uppercase small text-muted">Név</label>
                    <input type="text" class="form-control" id="nameInput" value="Gipsz Jakab">
                </div>
                <div class="mb-3">
                    <label for="passwordInput" class="form-label text-uppercase small text-muted">Password</label>
                    <input type="password" class="form-control" id="passwordInput" value="******">
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label small" for="rememberMe">Emlékezz rám</label>
                    </div>
                    <a href="#" class="small text-decoration-underline text-primary">Elfelejtetted a jelszavad?</a>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-dark"><a style="text-decoration: none; color: white;" href="dashboard.html">Bejelentkezés</a></button>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
